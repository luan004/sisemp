<div ng-controller="ItemList as ctrl">
    <side-bar>
    <div class="row g-3">
        <div class="col-12">
            <div class="d-flex">
                <button class="btn btn-sm btn-primary shadow-sm ms-auto">
                    <i class="fa fa-plus"></i>
                    Novo item
                </button>
            </div>
        </div>
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header d-flex">
                    Filtros
                    <div class="ms-auto">
                        <button class="btn py-0 px-1 btn-sm btn-primary">
                            <i class="fa fa-search"></i>
                            Buscar
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row gx-2 gy-3">
                        <div class="col-12 col-md-6 col-lg-3">
                            <label class="form-label">
                                Identificador
                            </label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <label class="form-label">
                                Nome
                            </label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-12 col-md-6 col-lg-3">
                            <label class="form-label">
                                Categoria
                            </label>
                            <select class="form-select"></select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body table-relative">
                    {{$ctrl.message}}
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="item in ctrl.items">
                                <td>{{item.title}}</td>
                                <td>{{item.description}}</td>
                                <td>
                                    <span class="badge bg-gradient shadow-sm text-bg-{{ ctrl.categories[item.category].color }}">
                                        {{ ctrl.categories[item.category].title }}
                                    </span>
                                </td>
                                <td>
                                    {{ ctrl.helpers.getPriceValue(item.price)}}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</side-bar>
</div>
